name: Publish npm patch

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        id: publish
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          merge_sha="$(git rev-parse HEAD)"
          attempt=0

          while true; do
            attempt=$((attempt + 1))
            release_state="$(node --input-type=module -e '
              const [packageName, mergeSha] = process.argv.slice(1);
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(packageName)}`);
              if (!response.ok) throw new Error(`npm registry returned ${response.status}`);
              const metadata = await response.json();
              const existing = Object.entries(metadata.versions)
                .find(([, manifest]) => manifest.gitHead === mergeSha)?.[0] ?? "";
              const latest = metadata["dist-tags"]?.latest;
              const match = latest?.match(/^(\d+)\.(\d+)\.(\d+)$/);
              if (!match) throw new Error(`Unsupported latest version: ${latest}`);
              const next = `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
              console.log(JSON.stringify({ existing, next }));
            ' "$package_name" "$merge_sha")"

            existing_version="$(node -p "JSON.parse(process.argv[1]).existing" "$release_state")"
            if [ -n "$existing_version" ]; then
              echo "version=$existing_version" >> "$GITHUB_OUTPUT"
              echo "status=already-published" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            next_version="$(node -p "JSON.parse(process.argv[1]).next" "$release_state")"
            npm version "$next_version" --no-git-tag-version --allow-same-version
            publish_log="$RUNNER_TEMP/npm-publish-$attempt.log"
            if npm publish --access public 2>&1 | tee "$publish_log"; then
              echo "version=$next_version" >> "$GITHUB_OUTPUT"
              echo "status=published" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! grep -Eqi "previously published|cannot publish over|EPUBLISHCONFLICT" "$publish_log"; then
              exit 1
            fi
            sleep 15
          done

      - name: Summarize the release
        run: echo "${{ steps.publish.outputs.status }} agentic-loop-playground@${{ steps.publish.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  package-offline:
    needs: publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build and verify the offline package
        run: npm run smoke:offline-package -- --version ${{ needs.publish.outputs.version }}

      - name: Create the release asset
        run: npm run pack:offline -- --version ${{ needs.publish.outputs.version }} --output release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-package-${{ runner.os }}-${{ runner.arch }}
          path: release/*.tgz
          if-no-files-found: error

  release:
    needs: [publish, package-offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: offline-package-*
          path: release
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          tag="v${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          fi
          gh release upload "$tag" release/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
